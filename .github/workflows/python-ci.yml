name: Agent Workbench CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run automated tests
        run: pytest -v

      - name: Check Python syntax
        run: python -m compileall -q agent_workbench

      - name: Verify project structure
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f agent_workbench/gemini.py
          test -f agent_workbench/tools.py
          test -f .env.example
          echo "Project structure verified."
