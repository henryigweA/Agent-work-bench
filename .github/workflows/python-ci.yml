name: Agent Workbench CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 1: Extract the uploaded ZIP
      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No project ZIP file found."
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

          test -f agent-workbench/pyproject.toml
          echo "Project extracted successfully."

      # STEP 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent-workbench/pyproject.toml

      # STEP 3: Install dependencies
      - name: Install dependencies
        working-directory: ./agent-workbench
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # STEP 4: Run automated tests
      - name: Run automated tests
        working-directory: ./agent-workbench
        run: pytest -v

      # STEP 5: Check Python syntax
      - name: Check Python syntax
        working-directory: ./agent-workbench
        run: python -m compileall -q agent_workbench

      # STEP 6: Verify project structure
      - name: Verify project structure
        working-directory: ./agent-workbench
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f agent_workbench/gemini.py
          test -f agent_workbench/tools.py
          test -f .env.example
          echo "Project structure verified."
